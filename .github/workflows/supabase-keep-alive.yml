# Mantém o projeto Supabase ativo (o plano Free pausa após ~7 dias sem atividade).
# A URL e a chave publishable vêm do arquivo .env.production (mesmo do site publicado).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 11 * * *"   # diariamente às 08:00 (BRT)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false
      - name: Ping no banco (RPC api_ping)
        run: |
          SUPABASE_URL=$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '\r ')
          SUPABASE_KEY=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env.production | cut -d= -f2- | tr -d '\r ')
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Preencha VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY no .env.production."
            exit 1
          fi

          for tentativa in 1 2 3; do
            status=$(curl -sS -o resposta.json -w "%{http_code}" \
              -X POST "$SUPABASE_URL/rest/v1/rpc/api_ping" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d '{}') || status=000

            echo "Tentativa $tentativa → HTTP $status"
            cat resposta.json 2>/dev/null; echo

            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 20
          done

          echo "::error::Supabase não respondeu ao ping."
          exit 1
